<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School Finder Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="heroLoginBtn">Login/Register</button>
  </header>

  <div id="schoolsList">
    <div class="school">
      <span>Delhi Public School</span>
      <div class="heart" data-school="Delhi Public School">&#10084;</div>
      <div class="rating" data-school="Delhi Public School">
        <span class="star" data-value="1">&#9733;</span>
        <span class="star" data-value="2">&#9733;</span>
        <span class="star" data-value="3">&#9733;</span>
        <span class="star" data-value="4">&#9733;</span>
        <span class="star" data-value="5">&#9733;</span>
      </div>
    </div>
    <div class="school">
      <span>St. Xavier's School</span>
      <div class="heart" data-school="St. Xavier's School">&#10084;</div>
      <div class="rating" data-school="St. Xavier's School">
        <span class="star" data-value="1">&#9733;</span>
        <span class="star" data-value="2">&#9733;</span>
        <span class="star" data-value="3">&#9733;</span>
        <span class="star" data-value="4">&#9733;</span>
        <span class="star" data-value="5">&#9733;</span>
      </div>
    </div>
  </div>

  <div id="wishlistArea"></div>

  <!-- MODAL -->
  <div id="authModal" class="modal">
    <span class="close">&times;</span>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <input id="loginEmail" placeholder="Email">
      <input id="loginPassword" placeholder="Password" type="password">
      <button id="loginBtn">Login</button>
      <p class="switch">Don't have an account? <span id="showRegister">Sign Up</span></p>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none;">
      <input id="registerEmail" placeholder="Email">
      <input id="registerUsername" placeholder="Username">
      <input id="registerPassword" placeholder="Password" type="password">
      <input id="registerConfirmPassword" placeholder="Confirm Password" type="password">
      <button id="registerBtn">Register</button>
      <p class="switch">Already have an account? <span id="showLogin">Login</span></p>
    </div>

    <!-- OTP SECTION -->
    <div id="otpSection" style="display:none;">
      <input id="regOTP" placeholder="Enter OTP">
      <button id="verifyOTP">Verify OTP</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
