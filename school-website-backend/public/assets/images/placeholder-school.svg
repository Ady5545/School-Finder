<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2d4a" />
      <stop offset="100%" stop-color="#1e4875" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Center Architecture Emblem -->
  <g transform="translate(400, 200)" text-anchor="middle">
    <!-- Outer Shield / Circle Glow -->
    <circle cx="0" cy="-20" r="54" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.04))" />
    
    <!-- Building / School Graphic -->
    <g transform="translate(-24, -44)" fill="none" stroke="#0f2d4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 22h40" />
      <path d="M8 22v-8l16-8 16 8v8" />
      <path d="M12 22v-6" />
      <path d="M20 22v-6" />
      <path d="M28 22v-6" />
      <path d="M36 22v-6" />
      <path d="M18 9l6-3 6 3" />
      <circle cx="24" cy="14" r="2" fill="#c2410c" stroke="none" />
    </g>

    <!-- Editorial Typography -->
    <text y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a" letter-spacing="-0.2">
      ADMISSION PITARA
    </text>
    <text y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.5">
      VERIFIED INDEPENDENT DIRECTORY
    </text>
  </g>

  <!-- Bottom Corner Subtext -->
  <text x="760" y="426" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
    Greater Noida West Directory
  </text>
</svg>
